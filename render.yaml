services:
  - type: web
    name: pravahax-api
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install && npx prisma generate && npx prisma db push --accept-data-loss && npm run build:server && npm run seed:safe
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: pravahax-db
          property: connectionString
      - key: NODE_ENV
        value: development
      - key: APP_ENV
        value: development
      - key: PORT
        value: 3000
      - key: TIMEZONE
        value: Asia/Kolkata
      - key: JWT_SECRET
        value: dev_secret_pravahax_attendance_movement_2026_key
      - key: CORS_ORIGIN
        value: https://face-detection-attendence-system-steel.vercel.app,http://localhost:5173
      - key: BIOMETRIC_MOCK
        value: "false"

databases:
  - name: pravahax-db
    plan: free
    region: oregon
    databaseName: pravahax_db
    user: postgres
