services:
  - type: web
    name: pravahax-api
    runtime: node
    plan: free
    region: oregon

    buildCommand: >
      (python3 -m pip install --break-system-packages
      -r src/modules/biometrics/workers/requirements.txt
      || pip3 install
      -r src/modules/biometrics/workers/requirements.txt)
      && python3 src/modules/biometrics/workers/download_models.py
      && npm install
      && npx prisma generate
      && npx prisma migrate deploy
      && npm run build:server

    startCommand: npm start

    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: pravahax-db
          property: connectionString

      - key: NODE_ENV
        value: production

      - key: APP_ENV
        value: production

      - key: PORT
        value: 3000

      - key: TIMEZONE
        value: Asia/Kolkata

      - key: JWT_SECRET
        sync: false

      - key: CORS_ORIGIN
        value: https://face-detection-attendence-system-steel.vercel.app,http://localhost:5173

      # ============================================================
      # BIOMETRIC ENGINE
      # ============================================================

      - key: BIOMETRIC_MOCK
        value: "false"

      - key: BIOMETRIC_ENGINE
        value: scrfd_adaface

      - key: BIOMETRIC_ALLOW_MOCK_FALLBACK
        value: "false"

      - key: PYTHON_BIN
        value: python3

      - key: MODELS_DIR
        value: ./models

      # ============================================================
      # SCRFD 2.5G KPS
      # ============================================================

      - key: SCRFD_MODEL_URL
        value: "https://huggingface.co/ArjunSharmaSSS/vision-detection-models/resolve/2f5f5956902788ea8e4a3d56637f2363217c8516/det_2.5g.onnx"

      - key: SCRFD_MODEL_SHA256
        value: "041f73f47371333d1d17a6fee6c8ab4e6aecabefe398ff32cca4e2d5eaee0af9"

      - key: SCRFD_MODEL_VERSION
        value: 2.5G-KPS

      - key: SCRFD_MODEL_LICENSE
        value: InsightFace pretrained checkpoint - research/evaluation only

      - key: SCRFD_MODEL_SOURCE
        value: InsightFace buffalo_m SCRFD 2.5G model

      # ============================================================
      # ADAFACE IR50
      # ============================================================

      - key: ADAFACE_MODEL_URL
        value: "https://huggingface.co/datnt114/adaface-onnx/resolve/main/ir50.onnx?download=true"

      - key: ADAFACE_MODEL_SHA256
        value: "4b044ba54c3b193ca80b920194caee5b417dcca9cbdcfbc81118fa56c838538a"

      - key: ADAFACE_MODEL_VERSION
        value: IR50-MS1MV2

      - key: ADAFACE_MODEL_LICENSE
        value: AdaFace IR50 MS1MV2 research/evaluation checkpoint

      - key: ADAFACE_MODEL_SOURCE
        value: AdaFace IR50 MS1MV2 ONNX checkpoint

      - key: ADAFACE_COLOR_SPACE
        value: BGR

      # ============================================================
      # RECOGNITION THRESHOLDS
      # Initial values - we will calibrate after physical testing
      # ============================================================

      - key: RECOGNITION_MATCH_THRESHOLD
        value: "0.45"

      - key: RECOGNITION_UNCERTAIN_THRESHOLD
        value: "0.30"

      - key: RECOGNITION_MIN_MARGIN
        value: "0.06"

databases:
  - name: pravahax-db
    plan: free
    region: oregon
    databaseName: pravahax
    user: pravahax
